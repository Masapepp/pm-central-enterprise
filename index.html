tton><button data-page="scheduler">▦<span>Schedule</span></button><button data-page="workorders">▤<span>Work</span></button><button data-page="uploads">⇧<span>Upload</span></button></nav><div id="modalroot"></div><script>
const URLS={bagging:'https://script.google.com/macros/s/AKfycbz_F-JG6m7071JlD0CjVpQgI4LizQ5UpGRxq50BLoARqYqdbdoC5fV06dbNN3y4G5oepQ/exec',analyzer:'https://script.google.com/macros/s/AKfycbyAPldrvvA0jTi4aAw_x7BKKwsfCq8vessqVLIaagWFiKgfkCBCu1vrOXIBKp0r5b0_/exec'};
const $=s=>document.querySelector(s);const read=k=>{try{return JSON.parse(localStorage.getItem('pmc_'+k)||'[]')}catch{return[]}};const save=(k,v)=>{localStorage.setItem('pmc_'+k,JSON.stringify(v));$('#storageState').textContent='Data tersimpan di perangkat ini'};let page='dashboard';const today=()=>new Date().toISOString().slice(0,10);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2600)}function go(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#crumb').textContent=({dashboard:'Dashboard',bagging:'Bagging',analyzer:'Analyzer',bfr:'BFR',warehouse:'Product Warehouse',scheduler:'PM Scheduler',equipment:'Equipment Master',workorders:'Work Orders',reports:'Reports Center',settings:'Settings & Data'})[p]||p;render()}
function head(title,sub,actions=''){return `<div class="pagehead"><div><div class="eyebrow">PM CENTRAL / OPERATIONS</div><h1 class="h1">${title}</h1><div class="sub">${sub}</div></div><div class="actions">${actions}</div></div>`}function kpi(label,note,val,color){return `<div class="card"><div class="kpi-top">${label}<span class="dot ${color}"></span></div><div class="kpi-num">${val}</div><div class="kpi-note">${note}</div></div>`}function dashboard(){let eq=read('equipment'),wo=read('workorders'),sc=read('schedules');let overdue=sc.filter(x=>x.date<today()&&x.status!=='Completed').length;return head('Executive Overview','Empat menu departemen utama langsung tersedia di halaman depan.',`<button class="btn" onclick="go('reports')">View reports</button><button class="btn primary" onclick="openForm('workorder')">+ Create work order</button>`)+`<section class="home-hero"><div><div class="eyebrow">MAINTENANCE CONTROL CENTER</div><h2>One platform. Four departments.</h2><p>Kelola preventive maintenance, checklist, equipment, dan pekerjaan tim dalam satu tempat.</p></div><div class="hero-chip-row"><span>● Integrated workspace</span><span>● Mobile ready</span></div></section><div class="department-grid"><article class="department-card"><div class="dept-symbol">▣</div><div><div class="eyebrow">DEPARTMENT 01</div><h2>BAGGING</h2><p>PM Ink Jet Printer · MI-01 sampai MI-20</p><button class="btn primary" onclick="go('bagging')">Buka Modul Bagging →</button></div></article><article class="department-card"><div class="dept-symbol">⌁</div><div><div class="eyebrow">DEPARTMENT 02</div><h2>ANALYZER</h2><p>PM Analyzer Water Treatment Plant</p><button class="btn primary" onclick="go('analyzer')">Buka Modul Analyzer →</button></div></article><article class="department-card"><div class="dept-symbol">⚙</div><div><div class="eyebrow">DEPARTMENT 03</div><h2>BFR</h2><p>Preventive Maintenance · Equipment dan checklist</p><button class="btn primary" onclick="go('bfr')">Buka Modul BFR →</button></div></article><article class="department-card"><div class="dept-symbol">▤</div><div><div class="eyebrow">DEPARTMENT 04</div><h2>PRODUCT WAREHOUSE</h2><p>Preventive Maintenance · Gudang Produk</p><button class="btn primary" onclick="go('warehouse')">Buka Modul Warehouse →</button></div></article></div><div class="grid kpis">${kpi('TOTAL EQUIPMENT','Equipment terdaftar',eq.length,'blue')}${kpi('PM SCHEDULED','Jadwal tersimpan',sc.length,'teal')}${kpi('WORK ORDERS','Total pekerjaan',wo.length,'amber')}${kpi('OVERDUE PM','Perlu tindak lanjut',overdue,'red')}</div><div class="grid two"><div class="card"><h3 class="section-title">Quick access</h3><div class="dept"><div class="dept-icon">▦</div><div class="dept-info"><b>PM Scheduler</b><small>Daily · Weekly · Monthly · Quarterly · Annual</small></div><button class="btn small" onclick="go('scheduler')">Open</button></div><div class="dept"><div class="dept-icon">⇧</div><div class="dept-info"><b>Upload File & Script</b><small>Kelola dokumen dan file script</small></div><button class="btn small" onclick="go('uploads')">Open</button></div></div><div class="card"><h3 class="section-title">Maintenance status</h3><p class="muted">Data KPI akan mengikuti data equipment, jadwal, dan work order yang dimasukkan.</p><button class="btn" onclick="go('reports')">Open Reports Center</button></div></div>`}
function table(rows,cols){if(!rows.length)return '<div class="empty">Belum ada data. Tekan tombol tambah untuk membuat data pertama.</div>';return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c.toUpperCase()}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c]||'—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function deptPage(which){let title=which==='bfr'?'BFR':'Product Warehouse';let arr=read('equipment').filter(x=>x.department===title);return head(title,which==='bfr'?'Preventive maintenance workspace for BFR equipment.':'Preventive maintenance workspace for warehouse equipment.',`<button class="btn primary" onclick="openForm('equipment','${title}')">+ Add equipment</button><button class="btn" onclick="go('scheduler')">PM schedule</button>`)+`<div class="notice">Modul ini menggunakan data equipment lokal sementara. Checklist khusus dan database terpusat akan diaktifkan pada fase integrasi backend.</div><div class="card"><h3 class="section-title">Equipment register</h3>${table(arr,['tag','name','category','location','department'])}</div>`}
function embedded(which){let title=which==='bagging'?'PM Ink Jet Printer':'PM Analyzer WTP',url=URLS[which];return head(title,which==='bagging'?'BAGGING · MI-01 sampai MI-20':'ANALYZER · Water Treatment Plant',`<button class="btn" onclick="window.open('${url}','_blank','noopener')">Open in new tab ↗</button>`)+`<div class="notice">Jika Google Apps Script menolak tampilan di dalam frame, gunakan tombol Open in new tab. Fungsi aplikasi asal tetap berada di Google Apps Script.</div><div class="iframebox"><iframe src="${url}" title="${title}" loading="lazy" referrerpolicy="no-referrer"></iframe></div>`}
function scheduler(){let a=read('schedules');return head('PM Scheduler','Buat dan pantau jadwal preventive maintenance.',`<button class="btn primary" onclick="openForm('schedule')">+ Add schedule</button>`)+`<div class="card"><div class="toolbar"><span class="status">Daily / Weekly / Monthly / Quarterly / Annual</span><span class="muted" style="font-size:11px">Recurring generation belum diaktifkan.</span></div>${table(a,['date','department','equipment','frequency','technician','status'])}</div>`}
function equipment(){let a=read('equipment');return head('Equipment Master','Daftar aset dan identitas peralatan maintenance.',`<button class="btn primary" onclick="openForm('equipment')">+ Add equipment</button>`)+`<div class="card"><div class="toolbar"><input class="search" id="eqsearch" placeholder="Cari tag / equipment..." oninput="filterTable('eqsearch','eqtable')"></div><div id="eqtable">${table(a,['tag','name','department','category','location'])}</div></div>`}
function workorders(){let a=read('workorders');return head('Work Orders','Catat pekerjaan, temuan, prioritas dan status penyelesaian.',`<button class="btn primary" onclick="openForm('workorder')">+ Create work order</button>`)+`<div class="card">${table(a,['number','date','department','equipment','priority','assignee','status'])}</div>`}
function reports(){let eq=read('equipment'),sc=read('schedules'),wo=read('workorders');return head('Reports Center','Ringkasan data yang tersimpan di perangkat ini.',`<button class="btn primary" onclick="exportAll()">Export CSV</button><button class="btn" onclick="window.print()">Print</button>`)+`<div class="grid three">${kpi('Equipment',eq.length,'Asset register','blue')}${kpi('PM Schedules',sc.length,'Schedule records','teal')}${kpi('Work Orders',wo.length,'Work records','amber')}</div><div class="card" style="margin-top:15px"><h3 class="section-title">Report scope</h3><p class="muted">Export CSV berisi equipment, jadwal PM, dan work order. PDF/XLSX dan format laporan resmi memerlukan pengembangan lanjutan.</p></div>`}
function dbOpen(){return new Promise((resolve,reject)=>{let req=indexedDB.open('pm-central-files',1);req.onupgradeneeded=()=>req.result.createObjectStore('files',{keyPath:'id',autoIncrement:true});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}async function storeUpload(file,kind){let db=await dbOpen();await new Promise((resolve,reject)=>{let tx=db.transaction('files','readwrite');tx.objectStore('files').add({name:file.name,type:file.type||'application/octet-stream',size:file.size,kind,added:new Date().toISOString(),blob:file});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}async function listUploads(kind){let db=await dbOpen();let rows=await new Promise((resolve,reject)=>{let tx=db.transaction('files','readonly'),r=tx.objectStore('files').getAll();r.onsuccess=()=>resolve(r.result.filter(x=>!kind||x.kind===kind).sort((a,b)=>b.id-a.id));r.onerror=()=>reject(r.error)});db.close();return rows}async function deleteUpload(id){let db=await dbOpen();await new Promise(resolve=>{let tx=db.transaction('files','readwrite');tx.objectStore('files').delete(Number(id));tx.oncomplete=resolve});db.close();renderUploads()}async function downloadUpload(id){let db=await dbOpen();let row=await new Promise(resolve=>{let r=db.transaction('files').objectStore('files').get(Number(id));r.onsuccess=()=>resolve(r.result)});db.close();if(row){let a=document.createElement('a');a.href=URL.createObjectURL(row.blob);a.download=row.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}function uploadPage(kind){let script=kind==='script';let title=script?'Script Management':'Upload File Baru';let desc=script?'Simpan file .gs, .js, .html dan file konfigurasi untuk dikelola Admin.':'Simpan checklist Excel, PDF, foto equipment, manual dan dokumen PM.';let id=script?'scriptUpload':'fileUpload';return head(title,desc)+`<div class="notice">${script?'Keamanan: file script hanya disimpan dan dapat diunduh. Script TIDAK dijalankan otomatis dari website. Perubahan Apps Script tetap dilakukan dan dipublikasikan melalui Google Apps Script.':'File tersimpan di browser/perangkat ini saja. Untuk berbagi ke seluruh tim diperlukan integrasi Google Drive atau database.'}</div><div class="card"><form id="${id}" class="formgrid"><div class="field full"><label>Pilih ${script?'file script':'dokumen atau file'} (bisa lebih dari satu)</label><input type="file" name="files" ${script?'accept=".gs,.js,.html,.json,.txt"':'accept=".pdf,.xls,.xlsx,.csv,.doc,.docx,.jpg,.jpeg,.png,.webp,.txt"'} multiple required></div><div class="field full"><button class="btn primary" type="submit">⇧ Upload ${script?'Script':'File'}</button></div></form></div><div class="card" style="margin-top:15px"><h3 class="section-title">Daftar ${script?'script':'file'} tersimpan</h3><div id="upload-list" class="upload-list"><div class="empty">Memuat daftar file…</div></div></div>`}async function renderUploads(){let root=document.getElementById('upload-list');if(!root)return;try{let kind=page==='scripts'?'script':'file',rows=await listUploads(kind);root.innerHTML=rows.length?rows.map(x=>`<div class="upload-item"><div><b>${esc(x.name)}</b><small>${(x.size/1024).toFixed(1)} KB · ${new Date(x.added).toLocaleString('id-ID')}</small></div><div class="actions"><button class="btn small" onclick="downloadUpload(${x.id})">Download</button><button class="btn small" onclick="deleteUpload(${x.id})">Hapus</button></div></div>`).join(''):'<div class="empty">Belum ada file yang diupload.</div>'}catch(e){root.innerHTML='<div class="empty">Browser tidak mendukung penyimpanan file lokal.</div>'}}function bindUpload(){let form=document.querySelector('#fileUpload,#scriptUpload');if(!form)return;form.onsubmit=async e=>{e.preventDefault();let files=[...form.querySelector('input[type=file]').files];try{for(let f of files)await storeUpload(f,page==='scripts'?'script':'file');toast(files.length+' file berhasil disimpan di perangkat ini');renderUploads();form.reset()}catch(err){alert('Upload gagal. Periksa ruang penyimpanan browser.')}}}
function settings(){return head('Settings & Data','Pengaturan penyimpanan sementara dan ekspor data.')+`<div class="grid two"><div class="card"><h3 class="section-title">Data storage</h3><p class="muted">Versi ini menyimpan data pada browser/perangkat yang digunakan melalui localStorage. Data belum tersinkron antar pengguna atau perangkat.</p><button class="btn" onclick="exportAll()">Export backup CSV</button></div><div class="card"><h3 class="section-title">Reset local data</h3><p class="muted">Hapus data contoh/input lokal dari browser ini. Tindakan ini tidak dapat dibatalkan.</p><button class="btn" style="border-color:var(--red);color:#ff9cab" onclick="resetData()">Clear local data</button></div></div><div class="notice" style="margin-top:15px">Belum terhubung: Supabase database, Google OAuth, Google Drive API, role-based access control, email notification, dan backup server.</div>`}
const PAGE_FLOW=['dashboard','bagging','analyzer','bfr','warehouse','scheduler','equipment','workorders','reports','uploads','scripts','settings'];function pageNavigation(){if(page==='dashboard')return '';let i=PAGE_FLOW.indexOf(page),prev=PAGE_FLOW[Math.max(0,i-1)],next=PAGE_FLOW[Math.min(PAGE_FLOW.length-1,i+1)],names={dashboard:'Home',bagging:'Bagging',analyzer:'Analyzer',bfr:'BFR',warehouse:'Product Warehouse',scheduler:'PM Scheduler',equipment:'Equipment Master',workorders:'Work Orders',reports:'Reports Center',uploads:'Upload File',scripts:'Script Management',settings:'Settings'};return `<div class="page-navigation"><button class="btn" onclick="go('${prev}')" ${i===0?'disabled':''}>← Back</button><div class="nav-caption">Halaman ${i+1} dari ${PAGE_FLOW.length}<br>${names[page]||page}</div><button class="btn primary" onclick="go('${next}')" ${i===PAGE_FLOW.length-1?'disabled':''}>Next →</button></div>`}
function render(){let html=({dashboard,bagging:()=>embedded('bagging'),analyzer:()=>embedded('analyzer'),bfr:()=>deptPage('bfr'),warehouse:()=>deptPage('warehouse'),scheduler,equipment,workorders,reports,settings,uploads:()=>uploadPage('file'),scripts:()=>uploadPage('script')})[page]();$('#view').innerHTML=html+pageNavigation();if(page==='uploads'||page==='scripts'){bindUpload();renderUploads()}}
function openForm(type,department=''){let fields=type==='equipment'?[['tag','Equipment Tag','text'],['name','Equipment Name','text'],['department','Department','select',['BAGGING','ANALYZER','BFR','Product Warehouse']],['category','Category','text'],['location','Location','text']]:type==='schedule'?[['date','PM Date','date'],['department','Department','select',['BAGGING','ANALYZER','BFR','Product Warehouse']],['equipment','Equipment Tag / Name','text'],['frequency','Frequency','select',['Daily','Weekly','Monthly','Quarterly','Semi-annually','Annually']],['technician','Technician','text'],['status','Status','select',['Scheduled','In Progress','Completed','Overdue','Cancelled']]]:[['date','Date','date'],['department','Department','select',['BAGGING','ANALYZER','BFR','Product Warehouse']],['equipment','Equipment Tag / Name','text'],['priority','Priority','select',['Critical','High','Medium','Low']],['assignee','Assigned Technician','text'],['description','Work Description','textarea'],['status','Status','select',['Open','In Progress','Closed']]];let title=type==='equipment'?'Add Equipment':type==='schedule'?'Add PM Schedule':'Create Work Order';$('#modalroot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeForm()"><div class="modalbox"><div class="modalhead"><b>${title}</b><button class="btn small" onclick="closeForm()">✕</button></div><form id="dataform" class="formgrid">${fields.map(([name,label,kind,opts])=>`<div class="field ${kind==='textarea'?'full':''}"><label>${label}</label>${kind==='select'?`<select name="${name}" required>${opts.map(o=>`<option>${o}</option>`).join('')}</select>`:kind==='textarea'?`<textarea name="${name}" required></textarea>`:`<input name="${name}" type="${kind}" ${name==='date'?'value="'+today()+'"':''} required>`}</div>`).join('')}<div class="field full"><button class="btn primary" type="submit">Save record</button></div></form></div></div>`;$('#dataform').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries());let key=type==='equipment'?'equipment':type==='schedule'?'schedules':'workorders';if(type==='workorder')d.number='WO-'+Date.now().toString().slice(-7);save(key,[...read(key),d]);closeForm();render();toast('Data berhasil disimpan pada perangkat ini') }}function closeForm(){$('#modalroot').innerHTML=''}function filterTable(input,container){let q=$('#'+input).value.toLowerCase();$('#'+container).innerHTML=table(read('equipment').filter(x=>Object.values(x).join(' ').toLowerCase().includes(q)),['tag','name','department','category','location'])}function exportAll(){let rows=[['TYPE','DATE','DEPARTMENT','TAG/NAME','DETAIL','STATUS']];for(let x of read('equipment'))rows.push(['EQUIPMENT','',x.department,x.tag,x.name,'']);for(let x of read('schedules'))rows.push(['SCHEDULE',x.date,x.department,x.equipment,x.frequency,x.status]);for(let x of read('workorders'))rows.push(['WORK ORDER',x.date,x.department,x.equipment,x.description,x.status]);let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='pm-central-export.csv';a.click();URL.revokeObjectURL(a.href)}function resetData(){if(confirm('Hapus seluruh data lokal PM CENTRAL pada browser ini?')){['equipment','schedules','workorders'].forEach(k=>localStorage.removeItem('pmc_'+k));render();toast('Data lokal dihapus')}}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));function tick(){$('#clock').textContent=new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})}tick();setInterval(tick,30000);render();
</script></body></html>
