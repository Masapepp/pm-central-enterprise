<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1424"><title>PM CENTRAL | Maintenance Management</title><style>
:root{--bg:#0b1424;--panel:#142238;--panel2:#192b42;--line:#2b405a;--text:#eef4fb;--muted:#9eb0c5;--blue:#398bff;--teal:#26c6b0;--red:#ff6577;--amber:#f4b84b;--green:#36c99a;--shadow:0 14px 40px #0003}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.side{background:#0e1b2d;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 25px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--teal));display:grid;place-items:center;font-weight:900;color:#061426}.brand b{font-size:16px;letter-spacing:.08em}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.navlabel{font-size:10px;color:#71859e;letter-spacing:.15em;padding:16px 12px 7px}.nav button{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#afc0d3;padding:12px;border-radius:9px;text-align:left;margin:2px 0}.nav button.active,.nav button:hover{background:#1b3553;color:#fff}.nav .ico{width:20px;text-align:center;color:#75aaff}.sidefoot{margin-top:24px;border-top:1px solid var(--line);padding:16px 10px;color:var(--muted);font-size:11px;line-height:1.6}.main{min-width:0}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;background:#0b1424ed;backdrop-filter:blur(12px);z-index:4}.crumb{font-size:13px;color:var(--muted)}.topright{display:flex;align-items:center;gap:12px}.pill{border:1px solid var(--line);padding:8px 11px;border-radius:8px;color:var(--muted);font-size:12px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#24456a;font-weight:700}.content{padding:28px 30px 60px;max-width:1500px;margin:auto}.pagehead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:23px}.eyebrow{color:var(--teal);font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.h1{font-size:27px;margin:7px 0 5px}.sub{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#1b304a;color:var(--text);padding:10px 14px;border-radius:8px;font-weight:600;font-size:13px}.btn.primary{background:var(--blue);border-color:var(--blue);color:#07172b}.btn.ghost{background:transparent}.btn.small{padding:7px 10px;font-size:12px}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:17px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px;box-shadow:var(--shadow);min-width:0}.kpi-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.kpi-num{font-size:29px;font-weight:750;margin:13px 0 5px}.kpi-note{font-size:11px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}.blue{background:var(--blue)}.teal{background:var(--teal)}.amber{background:var(--amber)}.red{background:var(--red)}.green{background:var(--green)}.two{grid-template-columns:1.4fr 1fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.section-title{font-size:14px;font-weight:700;margin:0 0 14px}.dept{display:flex;align-items:center;gap:13px;padding:14px;border:1px solid var(--line);border-radius:10px;background:#12243a}.dept+.dept{margin-top:9px}.dept-icon{width:40px;height:40px;border-radius:10px;background:#203d5d;display:grid;place-items:center;font-size:18px}.dept-info{flex:1;min-width:0}.dept-info b{font-size:13px}.dept-info small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.status{font-size:10px;padding:5px 8px;border-radius:99px;background:#253d55;color:#b9d1e8;white-space:nowrap}.status.ok{background:#123e3b;color:#70e3c8}.status.warn{background:#49391d;color:#ffd17a}.status.bad{background:#4a2631;color:#ff9cab}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:620px;font-size:12px}th,td{text-align:left;padding:12px 13px;border-bottom:1px solid var(--line)}th{color:#8fa4bb;font-weight:600;background:#122239}td{color:#dce7f2}tr:last-child td{border-bottom:0}.muted{color:var(--muted)}.barrow{display:grid;grid-template-columns:115px 1fr 30px;gap:10px;align-items:center;margin:13px 0;font-size:11px;color:var(--muted)}.bar{height:7px;background:#263c54;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:10px}.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted)}.field input,.field select,.field textarea,.search{background:#0f1d30;border:1px solid var(--line);color:var(--text);padding:11px;border-radius:8px;width:100%;outline:none}.field textarea{min-height:80px;resize:vertical}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar .search{max-width:260px}.iframebox{height:calc(100vh - 190px);min-height:560px;background:#fff;border-radius:10px;overflow:hidden}.iframebox iframe{width:100%;height:100%;border:0}.notice{background:#352d1c;border:1px solid #69542c;color:#f6d18a;padding:12px;border-radius:9px;font-size:12px;line-height:1.5;margin-bottom:15px}.department-carousel{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:linear-gradient(120deg,#132b45,#1a4560);padding:22px;margin:18px 0 20px}.carousel-slide{display:none;min-height:190px;align-items:center;gap:20px}.carousel-slide.active{display:flex}.carousel-symbol{width:86px;height:86px;flex:0 0 86px;border-radius:22px;background:#ffffff18;display:grid;place-items:center;font-size:34px}.carousel-copy{flex:1}.carousel-copy h2{font-size:24px;margin:0 0 8px}.carousel-copy p{color:#c1d1e2;margin:0 0 15px}.carousel-controls{display:flex;align-items:center;justify-content:space-between;margin-top:14px}.carousel-controls button{border:1px solid #ffffff55;background:#ffffff12;color:white;border-radius:9px;padding:9px 15px}.carousel-dots{display:flex;gap:7px}.carousel-dots span{width:8px;height:8px;border-radius:20px;background:#ffffff55}.carousel-dots span.active{width:22px;background:var(--teal)}.upload-list{display:grid;gap:9px;margin-top:15px}.upload-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--line);border-radius:9px;background:#12243a}.upload-item small{display:block;color:var(--muted);margin-top:4px}.mobilebar{display:none}.hide{display:none!important}.modal{position:fixed;inset:0;background:#0009;z-index:10;display:grid;place-items:center;padding:16px}.modalbox{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.toast{position:fixed;bottom:24px;right:24px;background:#16483f;color:#b8fff0;padding:12px 16px;border-radius:9px;z-index:20;box-shadow:var(--shadow)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.top{height:60px;padding:0 16px}.content{padding:21px 15px 90px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.three{grid-template-columns:1fr}.pagehead{display:block}.actions{margin-top:14px}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#0e1b2df5;border-top:1px solid var(--line);z-index:5;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.mobilebar button{border:0;background:transparent;color:#9eb0c5;font-size:10px;display:grid;gap:4px;justify-items:center}.mobilebar button.active{color:#72b1ff}.iframebox{height:calc(100vh - 175px);min-height:480px}.h1{font-size:23px}}@media(max-width:420px){.kpi-num{font-size:24px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.pill{display:none}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">PM</div><div><b>PM CENTRAL</b><small>INTEGRATED MAINTENANCE</small></div></div><nav class="nav" id="sidenav"><div class="navlabel">WORKSPACE</div><button data-page="dashboard" class="active"><span class="ico">▦</span>Dashboard</button><div class="navlabel">DEPARTMENTS</div><button data-page="bagging"><span class="ico">▣</span>Bagging</button><button data-page="analyzer"><span class="ico">⌁</span>Analyzer</button><button data-page="bfr"><span class="ico">⚙</span>BFR</button><button data-page="warehouse"><span class="ico">▤</span>Product Warehouse</button><div class="navlabel">MAINTENANCE</div><button data-page="scheduler"><span class="ico">▦</span>PM Scheduler</button><button data-page="equipment"><span class="ico">◫</span>Equipment Master</button><button data-page="workorders"><span class="ico">▤</span>Work Orders</button><button data-page="reports"><span class="ico">▥</span>Reports Center</button><div class="navlabel">DOCUMENTS & SCRIPTS</div><button data-page="uploads"><span class="ico">⇧</span>Upload File</button><button data-page="scripts"><span class="ico">⌘</span>Script Management</button><div class="navlabel">SYSTEM</div><button data-page="settings"><span class="ico">⚙</span>Settings & Data</button></nav><div class="sidefoot">PM CENTRAL Enterprise<br>Phase 1 • Local workspace<br><span id="storageState">Data tersimpan di perangkat ini</span></div></aside><main class="main"><header class="top"><div class="crumb">Operations / <b id="crumb">Dashboard</b></div><div class="topright"><span class="pill" id="clock"></span><span class="pill">LOCAL MODE</span><div class="avatar">M</div></div></header><section class="content" id="view"></section></main></div><nav class="mobilebar" id="mobilebar"><button data-page="dashboard" class="active">▦<span>Home</span></button><button data-page="bagging">▣<span>Bagging</span></button><button data-page="analyzer">⌁<span>Analyzer</span></button><button data-page="scheduler">▦<span>Schedule</span></button><button data-page="workorders">▤<span>Work</span></button><button data-page="uploads">⇧<span>Upload</span></button></nav><div id="modalroot"></div><script>
const URLS={bagging:'https://script.google.com/macros/s/AKfycbz_F-JG6m7071JlD0CjVpQgI4LizQ5UpGRxq50BLoARqYqdbdoC5fV06dbNN3y4G5oepQ/exec',analyzer:'https://script.google.com/macros/s/AKfycbyAPldrvvA0jTi4aAw_x7BKKwsfCq8vessqVLIaagWFiKgfkCBCu1vrOXIBKp0r5b0_/exec'};
const $=s=>document.querySelector(s);const read=k=>{try{return JSON.parse(localStorage.getItem('pmc_'+k)||'[]')}catch{return[]}};const save=(k,v)=>{localStorage.setItem('pmc_'+k,JSON.stringify(v));$('#storageState').textContent='Data tersimpan di perangkat ini'};let page='dashboard';const today=()=>new Date().toISOString().slice(0,10);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2600)}function go(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#crumb').textContent=({dashboard:'Dashboard',bagging:'Bagging',analyzer:'Analyzer',bfr:'BFR',warehouse:'Product Warehouse',scheduler:'PM Scheduler',equipment:'Equipment Master',workorders:'Work Orders',reports:'Reports Center',settings:'Settings & Data'})[p]||p;render()}
function head(title,sub,actions=''){return `<div class="pagehead"><div><div class="eyebrow">PM CENTRAL / OPERATIONS</div><h1 class="h1">${title}</h1><div class="sub">${sub}</div></div><div class="actions">${actions}</div></div>`}function kpi(label,note,val,color){return `<div class="card"><div class="kpi-top">${label}<span class="dot ${color}"></span></div><div class="kpi-num">${val}</div><div class="kpi-note">${note}</div></div>`}function dashboard(){let eq=read('equipment'),wo=read('workorders'),sc=read('schedules');let overdue=sc.filter(x=>x.date<today()&&x.status!=='Completed').length,done=sc.filter(x=>x.status==='Completed').length;return head('Executive Overview','Pilih salah satu dari empat departemen utama PM CENTRAL.',`<button class="btn" onclick="go('reports')">View reports</button><button class="btn primary" onclick="openForm('workorder')">+ Create work order</button>`)+`<div class="department-carousel" id="department-carousel"><div class="carousel-slide active"><div class="carousel-symbol">▣</div><div class="carousel-copy"><div class="eyebrow">DEPARTMENT 01 / 04</div><h2>BAGGING</h2><p>PM Ink Jet Printer · MI-01 sampai MI-20</p><button class="btn primary" onclick="go('bagging')">Buka Modul Bagging →</button></div></div><div class="carousel-slide"><div class="carousel-symbol">⌁</div><div class="carousel-copy"><div class="eyebrow">DEPARTMENT 02 / 04</div><h2>ANALYZER</h2><p>PM Analyzer Water Treatment Plant</p><button class="btn primary" onclick="go('analyzer')">Buka Modul Analyzer →</button></div></div><div class="carousel-slide"><div class="carousel-symbol">⚙</div><div class="carousel-copy"><div class="eyebrow">DEPARTMENT 03 / 04</div><h2>BFR</h2><p>Preventive Maintenance · Equipment dan checklist</p><button class="btn primary" onclick="go('bfr')">Buka Modul BFR →</button></div></div><div class="carousel-slide"><div class="carousel-symbol">▤</div><div class="carousel-copy"><div class="eyebrow">DEPARTMENT 04 / 04</div><h2>PRODUCT WAREHOUSE</h2><p>Preventive Maintenance · Gudang Produk</p><button class="btn primary" onclick="go('warehouse')">Buka Modul Warehouse →</button></div></div><div class="carousel-controls"><button id="carousel-prev" onclick="moveDepartment(-1)">← Previous</button><div><span id="carousel-count">1 / 4</span><div class="carousel-dots"><span class="active"></span><span></span><span></span><span></span></div></div><button id="carousel-next" onclick="moveDepartment(1)">Next →</button></div></div><div class="grid kpis">${kpi('TOTAL EQUIPMENT','Equipment terdaftar',eq.length,'blue')}${kpi('PM SCHEDULED','Jadwal tersimpan',sc.length,'teal')}${kpi('WORK ORDERS','Total pekerjaan',wo.length,'amber')}${kpi('OVERDUE PM','Perlu tindak lanjut',overdue,'red')}</div><div class="grid two"><div class="card"><h3 class="section-title">Quick access</h3><div class="dept"><div class="dept-icon">⇧</div><div class="dept-info"><b>UPLOAD FILE BARU</b><small>Checklist, PDF, Excel, foto equipment</small></div><button class="btn small" onclick="go('uploads')">Open</button></div><div class="dept"><div class="dept-icon">⌘</div><div class="dept-info"><b>SCRIPT MANAGEMENT</b><small>Kelola file script dan konfigurasi</small></div><button class="btn small" onclick="go('scripts')">Open</button></div></div><div class="card"><h3 class="section-title">PM status snapshot</h3><div class="barrow"><span>Completed</span><div class="bar"><i style="width:${sc.length?done/sc.length*100:0}%"></i></div><b>${done}</b></div><div class="barrow"><span>Overdue</span><div class="bar"><i style="width:${sc.length?overdue/sc.length*100:0}%;background:var(--red)"></i></div><b>${overdue}</b></div><div class="barrow"><span>Open work orders</span><div class="bar"><i style="width:${wo.length?wo.filter(x=>x.status!=='Closed').length/wo.length*100:0}%;background:var(--amber)"></i></div><b>${wo.filter(x=>x.status!=='Closed').length}</b></div><p class="muted" style="font-size:11px;margin-top:22px">Statistik dihitung dari data yang dimasukkan. Belum ada data operasional otomatis.</p></div></div><div class="card" style="margin-top:15px"><h3 class="section-title">Upcoming PM schedule</h3>${table(sc.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5),['date','department','equipment','frequency','status'])}</div>`}

function table(rows,cols){if(!rows.length)return '<div class="empty">Belum ada data. Tekan tombol tambah untuk membuat data pertama.</div>';return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c.toUpperCase()}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c]||'—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function deptPage(which){let title=which==='bfr'?'BFR':'Product Warehouse';let arr=read('equipment').filter(x=>x.department===title);return head(title,which==='bfr'?'Preventive maintenance workspace for BFR equipment.':'Preventive maintenance workspace for warehouse equipment.',`<button class="btn primary" onclick="openForm('equipment','${title}')">+ Add equipment</button><button class="btn" onclick="go('scheduler')">PM schedule</button>`)+`<div class="notice">Modul ini menggunakan data equipment lokal sementara. Checklist khusus dan database terpusat akan diaktifkan pada fase integrasi backend.</div><div class="card"><h3 class="section-title">Equipment register</h3>${table(arr,['tag','name','category','location','department'])}</div>`}
function embedded(which){let title=which==='bagging'?'PM Ink Jet Printer':'PM Analyzer WTP',url=URLS[which];return head(title,which==='bagging'?'BAGGING · MI-01 sampai MI-20':'ANALYZER · Water Treatment Plant',`<button class="btn" onclick="window.open('${url}','_blank','noopener')">Open in new tab ↗</button>`)+`<div class="notice">Jika Google Apps Script menolak tampilan di dalam frame, gunakan tombol Open in new tab. Fungsi aplikasi asal tetap berada di Google Apps Script.</div><div class="iframebox"><iframe src="${url}" title="${title}" loading="lazy" referrerpolicy="no-referrer"></iframe></div>`}
function scheduler(){let a=read('schedules');return head('PM Scheduler','Buat dan pantau jadwal preventive maintenance.',`<button class="btn primary" onclick="openForm('schedule')">+ Add schedule</button>`)+`<div class="card"><div class="toolbar"><span class="status">Daily / Weekly / Monthly / Quarterly / Annual</span><span class="muted" style="font-size:11px">Recurring generation belum diaktifkan.</span></div>${table(a,['date','department','equipment','frequency','technician','status'])}</div>`}
function equipment(){let a=read('equipment');return head('Equipment Master','Daftar aset dan identitas peralatan maintenance.',`<button class="btn primary" onclick="openForm('equipment')">+ Add equipment</button>`)+`<div class="card"><div class="toolbar"><input class="search" id="eqsearch" placeholder="Cari tag / equipment..." oninput="filterTable('eqsearch','eqtable')"></div><div id="eqtable">${table(a,['tag','name','department','category','location'])}</div></div>`}
function workorders(){let a=read('workorders');return head('Work Orders','Catat pekerjaan, temuan, prioritas dan status penyelesaian.',`<button class="btn primary" onclick="openForm('workorder')">+ Create work order</button>`)+`<div class="card">${table(a,['number','date','department','equipment','priority','assignee','status'])}</div>`}
function reports(){let eq=read('equipment'),sc=read('schedules'),wo=read('workorders');return head('Reports Center','Ringkasan data yang tersimpan di perangkat ini.',`<button class="btn primary" onclick="exportAll()">Export CSV</button><button class="btn" onclick="window.print()">Print</button>`)+`<div class="grid three">${kpi('Equipment',eq.length,'Asset register','blue')}${kpi('PM Schedules',sc.length,'Schedule records','teal')}${kpi('Work Orders',wo.length,'Work records','amber')}</div><div class="card" style="margin-top:15px"><h3 class="section-title">Report scope</h3><p class="muted">Export CSV berisi equipment, jadwal PM, dan work order. PDF/XLSX dan format laporan resmi memerlukan pengembangan lanjutan.</p></div>`}
let departmentIndex=0;function moveDepartment(step){let slides=[...document.querySelectorAll('.carousel-slide')];if(!slides.length)return;departmentIndex=(departmentIndex+step+slides.length)%slides.length;slides.forEach((el,i)=>el.classList.toggle('active',i===departmentIndex));let dots=document.querySelectorAll('.carousel-dots span');dots.forEach((el,i)=>el.classList.toggle('active',i===departmentIndex));let count=document.getElementById('carousel-count');if(count)count.textContent=(departmentIndex+1)+' / '+slides.length}function dbOpen(){return new Promise((resolve,reject)=>{let req=indexedDB.open('pm-central-files',1);req.onupgradeneeded=()=>req.result.createObjectStore('files',{keyPath:'id',autoIncrement:true});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}async function storeUpload(file,kind){let db=await dbOpen();await new Promise((resolve,reject)=>{let tx=db.transaction('files','readwrite');tx.objectStore('files').add({name:file.name,type:file.type||'application/octet-stream',size:file.size,kind,added:new Date().toISOString(),blob:file});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}async function listUploads(kind){let db=await dbOpen();let rows=await new Promise((resolve,reject)=>{let tx=db.transaction('files','readonly'),r=tx.objectStore('files').getAll();r.onsuccess=()=>resolve(r.result.filter(x=>!kind||x.kind===kind).sort((a,b)=>b.id-a.id));r.onerror=()=>reject(r.error)});db.close();return rows}async function deleteUpload(id){let db=await dbOpen();await new Promise(resolve=>{let tx=db.transaction('files','readwrite');tx.objectStore('files').delete(Number(id));tx.oncomplete=resolve});db.close();renderUploads()}async function downloadUpload(id){let db=await dbOpen();let row=await new Promise(resolve=>{let r=db.transaction('files').objectStore('files').get(Number(id));r.onsuccess=()=>resolve(r.result)});db.close();if(row){let a=document.createElement('a');a.href=URL.createObjectURL(row.blob);a.download=row.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}function uploadPage(kind){let script=kind==='script';let title=script?'Script Management':'Upload File Baru';let desc=script?'Simpan file .gs, .js, .html dan file konfigurasi untuk dikelola Admin.':'Simpan checklist Excel, PDF, foto equipment, manual dan dokumen PM.';let id=script?'scriptUpload':'fileUpload';return head(title,desc)+`<div class="notice">${script?'Keamanan: file script hanya disimpan dan dapat diunduh. Script TIDAK dijalankan otomatis dari website. Perubahan Apps Script tetap dilakukan dan dipublikasikan melalui Google Apps Script.':'File tersimpan di browser/perangkat ini saja. Untuk berbagi ke seluruh tim diperlukan integrasi Google Drive atau database.'}</div><div class="card"><form id="${id}" class="formgrid"><div class="field full"><label>Pilih ${script?'file script':'dokumen atau file'} (bisa lebih dari satu)</label><input type="file" name="files" ${script?'accept=".gs,.js,.html,.json,.txt"':'accept=".pdf,.xls,.xlsx,.csv,.doc,.docx,.jpg,.jpeg,.png,.webp,.txt"'} multiple required></div><div class="field full"><button class="btn primary" type="submit">⇧ Upload ${script?'Script':'File'}</button></div></form></div><div class="card" style="margin-top:15px"><h3 class="section-title">Daftar ${script?'script':'file'} tersimpan</h3><div id="upload-list" class="upload-list"><div class="empty">Memuat daftar file…</div></div></div>`}async function renderUploads(){let root=document.getElementById('upload-list');if(!root)return;try{let kind=page==='scripts'?'script':'file',rows=await listUploads(kind);root.innerHTML=rows.length?rows.map(x=>`<div class="upload-item"><div><b>${esc(x.name)}</b><small>${(x.size/1024).toFixed(1)} KB · ${new Date(x.added).toLocaleString('id-ID')}</small></div><div class="actions"><button class="btn small" onclick="downloadUpload(${x.id})">Download</button><button class="btn small" onclick="deleteUpload(${x.id})">Hapus</button></div></div>`).join(''):'<div class="empty">Belum ada file yang diupload.</div>'}catch(e){root.innerHTML='<div class="empty">Browser tidak mendukung penyimpanan file lokal.</div>'}}function bindUpload(){let form=document.querySelector('#fileUpload,#scriptUpload');if(!form)return;form.onsubmit=async e=>{e.preventDefault();let files=[...form.querySelector('input[type=file]').files];try{for(let f of files)await storeUpload(f,page==='scripts'?'script':'file');toast(files.length+' file berhasil disimpan di perangkat ini');renderUploads();form.reset()}catch(err){alert('Upload gagal. Periksa ruang penyimpanan browser.')}}}
function settings(){return head('Settings & Data','Pengaturan penyimpanan sementara dan ekspor data.')+`<div class="grid two"><div class="card"><h3 class="section-title">Data storage</h3><p class="muted">Versi ini menyimpan data pada browser/perangkat yang digunakan melalui localStorage. Data belum tersinkron antar pengguna atau perangkat.</p><button class="btn" onclick="exportAll()">Export backup CSV</button></div><div class="card"><h3 class="section-title">Reset local data</h3><p class="muted">Hapus data contoh/input lokal dari browser ini. Tindakan ini tidak dapat dibatalkan.</p><button class="btn" style="border-color:var(--red);color:#ff9cab" onclick="resetData()">Clear local data</button></div></div><div class="notice" style="margin-top:15px">Belum terhubung: Supabase database, Google OAuth, Google Drive API, role-based access control, email notification, dan backup server.</div>`}
function render(){let html=({dashboard,bagging:()=>embedded('bagging'),analyzer:()=>embedded('analyzer'),bfr:()=>deptPage('bfr'),warehouse:()=>deptPage('warehouse'),scheduler,equipment,workorders,reports,settings,uploads:()=>uploadPage('file'),scripts:()=>uploadPage('script')})[page]();$('#view').innerHTML=html;departmentIndex=0;if(page==='uploads'||page==='scripts'){bindUpload();renderUploads()}if(page==='dashboard'){let el=document.getElementById('department-carousel');let startX=0;if(el){el.ontouchstart=e=>startX=e.touches[0].clientX;el.ontouchend=e=>{let dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>45)moveDepartment(dx<0?1:-1)}}}}
function openForm(type,department=''){let fields=type==='equipment'?[['tag','Equipment Tag','text'],['name','Equipment Name','text'],['department','Department','select',['BAGGING','ANALYZER','BFR','Product Warehouse']],['category','Category','text'],['location','Location','text']]:type==='schedule'?[['date','PM Date','date'],['department','Department','select',['BAGGING','ANALYZER','BFR','Product Warehouse']],['equipment','Equipment Tag / Name','text'],['frequency','Frequency','select',['Daily','Weekly','Monthly','Quarterly','Semi-annually','Annually']],['technician','Technician','text'],['status','Status','select',['Scheduled','In Progress','Completed','Overdue','Cancelled']]]:[['date','Date','date'],['department','Department','select',['BAGGING','ANALYZER','BFR','Product Warehouse']],['equipment','Equipment Tag / Name','text'],['priority','Priority','select',['Critical','High','Medium','Low']],['assignee','Assigned Technician','text'],['description','Work Description','textarea'],['status','Status','select',['Open','In Progress','Closed']]];let title=type==='equipment'?'Add Equipment':type==='schedule'?'Add PM Schedule':'Create Work Order';$('#modalroot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeForm()"><div class="modalbox"><div class="modalhead"><b>${title}</b><button class="btn small" onclick="closeForm()">✕</button></div><form id="dataform" class="formgrid">${fields.map(([name,label,kind,opts])=>`<div class="field ${kind==='textarea'?'full':''}"><label>${label}</label>${kind==='select'?`<select name="${name}" required>${opts.map(o=>`<option>${o}</option>`).join('')}</select>`:kind==='textarea'?`<textarea name="${name}" required></textarea>`:`<input name="${name}" type="${kind}" ${name==='date'?'value="'+today()+'"':''} required>`}</div>`).join('')}<div class="field full"><button class="btn primary" type="submit">Save record</button></div></form></div></div>`;$('#dataform').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target).entries());let key=type==='equipment'?'equipment':type==='schedule'?'schedules':'workorders';if(type==='workorder')d.number='WO-'+Date.now().toString().slice(-7);save(key,[...read(key),d]);closeForm();render();toast('Data berhasil disimpan pada perangkat ini') }}function closeForm(){$('#modalroot').innerHTML=''}function filterTable(input,container){let q=$('#'+input).value.toLowerCase();$('#'+container).innerHTML=table(read('equipment').filter(x=>Object.values(x).join(' ').toLowerCase().includes(q)),['tag','name','department','category','location'])}function exportAll(){let rows=[['TYPE','DATE','DEPARTMENT','TAG/NAME','DETAIL','STATUS']];for(let x of read('equipment'))rows.push(['EQUIPMENT','',x.department,x.tag,x.name,'']);for(let x of read('schedules'))rows.push(['SCHEDULE',x.date,x.department,x.equipment,x.frequency,x.status]);for(let x of read('workorders'))rows.push(['WORK ORDER',x.date,x.department,x.equipment,x.description,x.status]);let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='pm-central-export.csv';a.click();URL.revokeObjectURL(a.href)}function resetData(){if(confirm('Hapus seluruh data lokal PM CENTRAL pada browser ini?')){['equipment','schedules','workorders'].forEach(k=>localStorage.removeItem('pmc_'+k));render();toast('Data lokal dihapus')}}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));function tick(){$('#clock').textContent=new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})}tick();setInterval(tick,30000);render();
</script></body></html>
